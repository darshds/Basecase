<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background square -->
  <rect width="32" height="32" rx="4" fill="#1D33E0"/>
  <!-- ( bracket left -->
  <text x="3" y="23" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="white">(</text>
  <!-- i dot + line -->
  <rect x="14" y="8" width="4" height="4" rx="1" fill="white"/>
  <rect x="14" y="14" width="4" height="11" rx="1" fill="white"/>
  <!-- ) bracket right -->
  <text x="21" y="23" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="white">)</text>
</svg>
