<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Basecase Tech">
  <!--
    The wordmark's ( ■ ) glyph, matching .mark-sq in globals.css: mono
    parentheses in --ink around a --signal blue square.

    The parentheses are stroked arcs rather than text, because a font glyph
    hints into mush at 16px. The square is kept large on purpose: at tab size
    it is the only part still legible, so it carries the recognition. The light
    chip keeps the dark mark readable against a dark browser tab strip.
  -->
  <rect width="32" height="32" rx="6.5" fill="#F3F5F3"/>
  <g fill="none" stroke="#0C110F" stroke-width="2.9" stroke-linecap="round">
    <path d="M10.8 6.4 Q 5.4 16 10.8 25.6"/>
    <path d="M21.2 6.4 Q 26.6 16 21.2 25.6"/>
  </g>
  <rect x="12.3" y="12.3" width="7.4" height="7.4" rx="1.4" fill="#1D33E0"/>
</svg>
